line-length = 79

[lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = [
    "UP006",  # Non-pep585-annotation (use of List, Dict, Tuple from typing)
    "UP007",  # Non-pep604-annotation (use of Union from typing)
    "UP035",  # Deprecated-import (importing List, Dict from typing)
    "UP045",  # Non-pep604-annotation (use of Optional from typing)
    "E402",   # Module level import not at top of file
    "RUF001", # Ambiguous unicode character in string (Cyrillic in Ukrainian UI)
    "RUF002", # Ambiguous unicode character in docstring (Ukrainian docstrings)
    "RUF003", # Ambiguous unicode character in comment (Ukrainian comments)
    "RUF100", # Unused noqa directive
]
