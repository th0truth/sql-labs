[project]
name = "flask-sql-starter"
version = "0.1.0"
description = "Bookstore Information Management System (SQL Lab 04)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2>=0.1.10",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "matplotlib>=3.9.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
]

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.lint]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
]

[tool.ruff.format]
indent-style = "space"
