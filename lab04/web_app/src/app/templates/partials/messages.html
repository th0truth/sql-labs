<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category in ['success', 'error', 'info'] else 'info' }}">
                    <span>{{ message }}</span>
                    <button type="button" class="close-btn" aria-label="Закрити">&times;</button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>
